<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meu Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#14171c">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
<style>
  :root{
    --bg: #14171c;
    --bg-elevated: #1c2028;
    --bg-card: #1a1e25;
    --line: #2a2f39;
    --text: #e8e9ec;
    --text-dim: #9198a6;
    --text-faint: #5c6472;
    --accent: #8fae6f;
    --accent-soft: #35402c;
    --red: #d9695f;
    --red-soft: #3a2523;
    --amber: #d9a559;
    --amber-soft: #3a3323;
    --blue: #6f9ad9;
    --blue-soft: #232d3a;
    --green: #6fbf8b;
    --radius: 14px;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px;}

  header.topbar{padding:22px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;}
  header.topbar h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;letter-spacing:-0.01em;}
  header.topbar .sub{font-size:12.5px;color:var(--text-faint);}

  main{padding:4px 14px 20px;flex:1;}
  section.tab{display:none;}
  section.tab.active{display:block;}

  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:14.5px;font-weight:600;margin:0 0 3px;font-family:var(--sans);}
  .card .desc{font-size:12px;color:var(--text-faint);margin:0 0 12px;line-height:1.5;}

  .num{font-family:var(--mono);}
  .num-lg{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-0.02em;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  .neutral{color:var(--text);}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  .stat{background:var(--bg-elevated);border-radius:10px;padding:10px 12px;}
  .stat .label{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .stat .val{font-family:var(--mono);font-size:15px;font-weight:600;}

  label{display:block;font-size:11.5px;color:var(--text-dim);margin:10px 0 4px;}
  input, select, textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 11px;font-size:16px;font-family:var(--sans);
  }
  input[type=number], input.money, input[type=date]{font-family:var(--mono);}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:50px;}

  .toggle2{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .toggle2 button{flex:1;background:var(--bg-elevated);border:none;color:var(--text-dim);padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .toggle2 button.on.despesa{background:var(--red-soft);color:var(--red);}
  .toggle2 button.on.receita{background:var(--accent-soft);color:var(--accent);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#12160e;border:none;border-radius:9px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%;font-family:var(--sans);}
  .btn.secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px dashed var(--line);}
  .btn.small{width:auto;padding:7px 12px;font-size:12.5px;}
  .btn.danger{background:var(--red-soft);color:var(--red);}

  .chipbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;}
  .chip{white-space:nowrap;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:100px;font-size:12.5px;cursor:pointer;}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .entry{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .entry:last-child{border-bottom:none;}
  .entry .bar{width:3px;align-self:stretch;border-radius:3px;flex-shrink:0;}
  .bar.cinza{background:#6b7280;}
  .bar.amarelo{background:var(--amber);}
  .bar.verde{background:var(--green);}
  .bar.azul{background:var(--blue);}
  .entry .info{flex:1;min-width:0;}
  .entry .info .desc-line{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .info .meta-line{font-size:11.5px;color:var(--text-faint);}
  .entry .val{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;}

  .date-sep{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;padding:12px 4px 4px;}

  .search{margin-bottom:8px;}

  .fixedline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .fixedline:last-of-type{border-bottom:none;}
  .fixedline .name{font-size:14px;font-weight:500;}
  .fixedline .sub{font-size:11.5px;color:var(--text-faint);}

  .catbar-wrap{margin-bottom:12px;}
  .catbar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .catbar-track{height:7px;background:var(--bg-elevated);border-radius:6px;overflow:hidden;position:relative;}
  .catbar-fill{height:100%;background:var(--red);border-radius:6px;}
  .catbar-fill.under{background:var(--accent);}
  .goal-marker{position:absolute;top:-2px;width:2px;height:11px;background:var(--text);}

  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(20,23,28,0.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--text-faint);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;font-family:var(--sans);}
  nav.tabbar button .ico{font-size:18px;}
  nav.tabbar button.active{color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,11,14,0.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--bg-card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .modal-head h3{margin:0;font-size:16px;font-family:var(--serif);}
  .modal-head .x{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;padding:4px;}

  .empty{text-align:center;padding:26px 10px;color:var(--text-faint);font-size:13px;}

  .orient-line{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;}
  .orient-line:last-child{border-bottom:none;}
  .orient-line .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);margin-top:6px;flex-shrink:0;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1 id="header-title">Meu Financeiro</h1>
      <div class="sub" id="header-sub">—</div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* ambiente não suporta — sem problema, app.js já resolve o storage sozinho */ });
  }
</script>
</body>
</html>
